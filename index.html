<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Right of Way — playable demo (v0.7 rules)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
<meta name="theme-color" content="#1d3557">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if(location.protocol.indexOf("http")===0){var l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l);}</script>
</head>
<body>
<header id="topbar">
  <div class="brand">RIGHT OF WAY <span class="sub">playtest demo · rules v0.7</span></div>
  <div id="status"></div>
  <div class="topbtns">
    <button id="btnUndo" title="Undo your last action this round (rewinds any AI moves made since; disabled once another human acts)">↶ Undo</button>
    <button id="btnHelp">How to play</button>
    <button id="btnSummary" title="Last round's income breakdown">Round summary</button>
    <button id="btnNew">New game</button>
  </div>
</header>
<main id="main">
  <section id="boardWrap">
    <div id="boardTools"></div>
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="legend"></div>
  </section>
  <section id="side">
    <div id="tabs">
      <button data-tab="act" class="on">Turn</button>
      <button data-tab="mats">Player mats</button>
      <button data-tab="hall">City Hall</button>
      <button data-tab="log">Log</button>
    </div>
    <div id="tab-act" class="tab on"></div>
    <div id="tab-mats" class="tab"></div>
    <div id="tab-hall" class="tab"></div>
    <div id="tab-log" class="tab"></div>
  </section>
</main>
<div id="tip" class="tip"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
